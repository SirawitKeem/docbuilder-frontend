<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" width="600" height="150">
  <defs>
    <!-- Main Red Ribbon Gradient -->
    <linearGradient id="ribbonFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="35%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <!-- Dark Shadow Under Ribbon -->
    <linearGradient id="ribbonShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7f1d1d" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>
    <!-- Highlight Reflection on Top Edge -->
    <linearGradient id="edgeHighlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#fca5a5" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1" />
    </linearGradient>
    <!-- Drop Shadow Filter -->
    <filter id="ribbonDropShadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#7f1d1d" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Accent Sound Rays / Flashes around the badge -->
  <line x1="60" y1="35" x2="35" y2="20" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />
  <line x1="50" y1="58" x2="20" y2="58" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round" />
  <line x1="65" y1="80" x2="35" y2="95" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />

  <!-- Under Layer: Dark 3D Base -->
  <polygon points="78,32 542,12 552,108 88,128" fill="url(#ribbonShadow)" />

  <!-- Main Banner Polygon (Angled Perspective Ribbon) -->
  <polygon points="80,24 540,8 548,100 88,116" fill="url(#ribbonFace)" filter="url(#ribbonDropShadow)" />

  <!-- Top Gloss Highlight Strip -->
  <polygon points="81,24 539,9 538,30 83,44" fill="url(#edgeHighlight)" opacity="0.35" />

  <!-- Right Ribbon Fold / Cutout Accent -->
  <polygon points="540,8 565,54 548,100 540,100" fill="#7f1d1d" />
</svg>
