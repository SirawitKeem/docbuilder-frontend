<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="redGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="shadowIcon1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.2" />
    </filter>
  </defs>
  <circle cx="40" cy="40" r="38" fill="url(#redGrad1)" filter="url(#shadowIcon1)" />
  <!-- Calendar Body -->
  <rect x="22" y="24" width="30" height="26" rx="4" fill="none" stroke="#FFFFFF" stroke-width="3" />
  <line x1="22" y1="32" x2="52" y2="32" stroke="#FFFFFF" stroke-width="2.5" />
  <!-- Top Pins -->
  <line x1="28" y1="20" x2="28" y2="25" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <line x1="46" y1="20" x2="46" y2="25" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <!-- Calendar Grid Dots -->
  <circle cx="30" cy="38" r="1.8" fill="#FFFFFF" />
  <circle cx="38" cy="38" r="1.8" fill="#FFFFFF" />
  <circle cx="30" cy="44" r="1.8" fill="#FFFFFF" />
  <!-- Clock Circle Bottom-Right -->
  <circle cx="48" cy="48" r="13" fill="#b91c1c" stroke="#FFFFFF" stroke-width="3" />
  <polyline points="48,41 48,48 53,51" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
